services:
  api-notion:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3000"
      AMBIENTE: "prod"
      DB_HOST: "mongo-core"
      DB_PORT: "27017"
    expose:
      - "3000"
    networks:
      core-backbone:
      proxy-edge:
        aliases:
          - api-notion
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/healthCheck', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  core-backbone:
    external: true
    name: core-backbone
  proxy-edge:
    external: true
    name: proxy-edge
